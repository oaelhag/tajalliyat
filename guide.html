<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>اسم يناسب حالك</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* اتجاه التصميم: بطاقة واحدة هادئة في كل خطوة، ليلية ذهبية كما في الموقع، بلا نقاط ولا ترتيب. */
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --fg:#1B2338; --muted:#59627A; --gold:#9A6A18; --gold-soft:#F6EBD3; --lapis-soft:#E4E9F5; --rule:#D5D9E4;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1324;--surface:#171E36;--fg:#E9E6DD;--muted:#A9B3D0;--gold:#E3B45C;--gold-soft:#2A2A2E;--lapis-soft:#1B2547;--rule:#2B3453;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1324;--surface:#171E36;--fg:#E9E6DD;--muted:#A9B3D0;--gold:#E3B45C;--gold-soft:#2A2A2E;--lapis-soft:#1B2547;--rule:#2B3453;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1.15rem/1.9 var(--body);padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:640px;margin-inline:auto;display:grid;gap:22px}

.nameblock .t{color:var(--muted)}

.center{text-align:center}.n2{font:700 2rem/1.3 var(--display);color:var(--gold);margin:0}.box .t{color:var(--muted)}.ayah.small{font-size:1.35rem;line-height:2}.box.ma{background:var(--lapis-soft);border-color:transparent}

.comp summary::after{content:"اضغط لقراءة المعنى والآية";font:500 .8rem var(--ui);color:var(--muted);margin-top:4px}.comp[open] summary::after{content:"إخفاء"}

.steps{margin:0;padding-inline-start:22px;display:grid;gap:6px}
.sit.other{border-style:dashed;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{font:500 1rem/1.3 var(--ui);color:var(--fg);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.main{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.status{font:500 .9rem var(--ui);color:var(--muted);min-height:1.4em}
.note{font:400 .9rem/1.8 var(--ui);color:var(--muted);background:var(--lapis-soft);border-radius:12px;padding:12px 14px}
details{border-top:1px solid var(--rule);padding-top:14px}
summary{cursor:pointer;font:500 1rem var(--ui);color:var(--muted)}
.all{display:grid;gap:14px;margin-top:14px;font:400 .95rem/1.7 var(--ui)}
.all b{color:var(--gold);font-weight:500}
.all li{margin-bottom:6px}
.all ul{margin:6px 0 0;padding-inline-start:20px}
.all em{font-style:normal;color:var(--muted)}
</style></head><body>

      h('button',{class:'btn',type:'button',onclick:()=>stepSits(s.f)},'موقف آخر'),
      h('button',{class:'btn',type:'button',onclick:stepFeelings},'شعور آخر'),
      h('a',{class:'btn',href:'https://oaelhag.github.io/tajalliyat/n/'+s.n+'/',target:'_blank',rel:'noopener'},'اقرأ عن الاسم')),
    status,
    h('p',{class:'note'},'اختيار الأسماء لكل موقف اجتهاد للتأمل وليس فتوى ولا وعداً بنتيجة، والنص من بطاقات الأسماء المعتمدة.')));
}
function allList(){
  const by={};D.sits.forEach(s=>(by[s.f]=by[s.f]||[]).push(s));
  return h('details',{},h('summary',{},'كل المواقف في هذا النموذج ('+D.sits.length.toLocaleString('ar-EG')+')'),
    h('div',{class:'all'},D.feels.map(f=>h('div',{},h('b',{},f.label),h('ul',{},by[f.id].map(s=>h('li',{},s.t,' ',h('em',{},'← '+D.names[s.n].plain))))))));
}
stepFeelings();
</script>
