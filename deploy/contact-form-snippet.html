<!-- Paste inside the landing/site page when the backend is live -->
<form id="contactForm" class="card" style="max-width:560px;margin:24px auto" novalidate>
  <h3>تواصل معنا</h3>
  <p><label>الاسم<br><input name="name" required maxlength="100" style="width:100%"></label></p>
  <p><label>البريد الإلكتروني<br><input name="email" type="email" required maxlength="190" style="width:100%"></label></p>
  <p><label>رسالتك<br><textarea name="message" required minlength="5" maxlength="4000" rows="5" style="width:100%"></textarea></label></p>
  <!-- honeypot: hidden from people, bots fill it -->
  <p style="position:absolute;left:-9999px" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></p>
  <button type="submit">إرسال</button>
  <p id="contactMsg" role="status"></p>
</form>
<script>
document.getElementById('contactForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var f = e.target, out = document.getElementById('contactMsg');
  out.textContent = 'جارٍ الإرسال…';
  try {
    var r = await fetch('/backend/api/contact.php', { method: 'POST', body: new FormData(f) });
    var j = await r.json();
    if (j.ok) { out.textContent = 'وصلتنا رسالتك، شكرًا لك.'; f.reset(); }
    else if (j.error === 'too_many_requests') out.textContent = 'محاولات كثيرة، جرّب لاحقًا.';
    else if (j.error === 'invalid_input') out.textContent = 'تأكد من الاسم والبريد والرسالة.';
    else out.textContent = 'تعذّر الإرسال الآن، جرّب لاحقًا.';
  } catch (err) { out.textContent = 'تعذّر الإرسال الآن، جرّب لاحقًا.'; }
});
</script>
